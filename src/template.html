<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <!-- No script tag needed, automatically handled by HtmlWebpackPlugin -->
  </head>
  <body>
    <header>Snake</header>
    <main>
      <span id="scoreboard"></span>
      <div id="playField"></div>
      <div class="keyPad">
        <span></span>
        <span id="KeyW">W</span>
        <span></span>
        <span id="KeyA">A</span>
        <span id="KeyS">S</span>
        <span id="KeyD">D</span>
      </div>
      <div class="keyPad">
        <span></span>
        <span id="ArrowUp">&uarr;</span>
        <span></span>
        <span id="ArrowLeft">&larr;</span>
        <span id="ArrowDown">&darr;</span>
        <span id="ArrowRight">&rarr;</span>
      </div>
      <div class="touchPad">
        <button id="TouchUp">&uarr;</button>
        <button id="TouchLeft">&larr;</button>
        <button id="TouchRight">&rarr;</button>
        <button id="TouchDown">&darr;</button>
      </div>
    </main>
  </body>
</html>
